name: AI News → Telegram

on:
  schedule:
    # 每 1 小时跑一次（UTC）
    - cron: "0 * * * *"
  workflow_dispatch: # 允许在网页上手动点「Run workflow」

permissions:
  contents: write # 把 data/seen.json 写回仓库做去重

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_TEMPERATURE: "0"
          MAX_POSTS_PER_RUN: "12"
          LOOKBACK_HOURS: "48"
        run: python bot.py

      - name: Commit seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add -f data/seen.json
          if git diff --staged --quiet; then
            echo "No seen.json changes"
          else
            git commit -m "chore: update seen.json"
            git push
          fi
